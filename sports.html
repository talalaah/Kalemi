<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#0b1038;color:white;padding:15px;position:sticky;top:0;z-index:5}.top,main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.brand i{margin-right:7px}.refresh,.tab{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.refresh{background:white;color:#0b1038}main{padding:16px}.hero{background:linear-gradient(135deg,#11184c,#272f7c);color:white;border-radius:20px;padding:20px}.hero h1{margin:0 0 5px}.hero p{margin:0;opacity:.8}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{background:white;white-space:nowrap}.tab.active{background:#0b1038;color:white}.status{font-size:13px;color:#6b7280;margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px}.dot.off{background:#f59e0b}.match{background:white;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 20px #0f172a10}.league{font-size:12px;color:#6b7280;font-weight:700;margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{text-align:center;font-weight:700}.team i{display:block;color:#64748b;font-size:22px;margin-bottom:5px}.score{text-align:center;font-weight:900;font-size:18px}.time{font-size:12px;color:#6b7280;margin-top:7px}.live{background:#fee2e2;color:#b91c1c;border-radius:99px;padding:4px 7px;font-size:10px}.empty{text-align:center;padding:40px;color:#6b7280}.error{background:#fff1f2;color:#9f1239;padding:14px;border-radius:14px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:white;width:100%;max-height:85vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;border-radius:50%;width:38px;height:38px}
</style></head><body><header><div class="top"><div class="brand"><i class="fa-solid fa-futbol"></i>Sports</div><button class="refresh" onclick="load(current)"><i class="fa-solid fa-rotate"></i> Actualiser</button></div></header><main><section class="hero"><h1>Matchs de football</h1><p>Données réelles fournies par Sportmonks.</p></section><div class="tabs"><button class="tab active" onclick="switchView('today',this)">Aujourd'hui</button><button class="tab" onclick="switchView('tomorrow',this)">Demain</button><button class="tab" onclick="switchView('live',this)">🔴 Live</button></div><div class="status"><span id="dot" class="dot off"></span><span id="status">Chargement…</span></div><div id="content"></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button><div id="detail">Chargement…</div></div></div>
<script>
let current="today";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function team(f,loc){const p=f.participants||[];return (p.find(x=>x.meta?.location===loc)||p[loc==="home"?0:1])?.name||"Équipe";}
function sc(f,loc){const p=(f.participants||[]).find(x=>x.meta?.location===loc);const s=(f.scores||[]).find(x=>x.description==="CURRENT"&&x.participant_id===p?.id);return s?.score?.goals??null}
function live(f){return /live|inplay|half|extra/i.test(f.state?.name||"")}
function time(f){return f.starting_at?new Date(f.starting_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}
function render(a){const c=document.getElementById("content");if(!a.length){c.innerHTML='<div class="empty"><i class="fa-regular fa-calendar-xmark" style="font-size:32px"></i><p>Aucun match disponible.</p></div>';return}c.innerHTML=a.map(f=>{const h=team(f,"home"),v=team(f,"away"),hs=sc(f,"home"),as=sc(f,"away"),li=live(f);return `<article class="match" onclick="openMatch(${Number(f.id)})"><div class="league">${esc(f.league?.name||"Football")} ${li?'<span class="live">● LIVE</span>':""}</div><div class="teams"><div class="team"><i class="fa-solid fa-shield"></i>${esc(h)}</div><div class="score">${hs!==null||as!==null?`${hs??0} - ${as??0}`:time(f)}</div><div class="team"><i class="fa-solid fa-shield"></i>${esc(v)}</div></div><div class="time">${esc(f.state?.name||time(f))}</div></article>`}).join("")}
async function load(v){current=v;document.getElementById("status").textContent="Chargement…";try{const r=await fetch(v==="today"?"/api/matches/today":v==="tomorrow"?"/api/matches/tomorrow":"/api/live");const j=await r.json();if(!r.ok)throw Error(j.error||"Erreur API");render(j.data||[]);document.getElementById("status").textContent=`${(j.data||[]).length} match(s) chargé(s)`;document.getElementById("dot").className="dot"}catch(e){document.getElementById("content").innerHTML=`<div class="error"><b>Erreur :</b> ${esc(e.message)}</div>`;document.getElementById("status").textContent="Erreur"}}
function switchView(v,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");load(v)}
async function openMatch(id){document.getElementById("modal").classList.add("show");try{const r=await fetch("/api/matches/"+id),j=await r.json();if(!r.ok)throw Error(j.error);const f=j.data||{},e=f.events||[];document.getElementById("detail").innerHTML=`<h2>${esc(team(f,"home"))} — ${esc(team(f,"away"))}</h2><p>${esc(f.league?.name||"")} · ${esc(f.state?.name||"")}</p><h3>Événements</h3>${e.length?e.map(x=>`<p><b>${esc(x.minute??"")}'</b> ${esc(x.type?.name||x.player_name||"Événement")} ${x.result?"· "+esc(x.result):""}</p>`).join(""):"<p>Aucun événement disponible.</p>"}`}catch(e){document.getElementById("detail").innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function closeModal(){document.getElementById("modal").classList.remove("show")}load("today");setInterval(()=>current==="live"&&load("live"),30000);
</script></body></html>
